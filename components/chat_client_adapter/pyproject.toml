[project]
name = "chat-client-adapter"
version = "0.1.0"
requires-python = ">=3.12"
description = "Adapter implementing the ChatClient contract over the remote service"
dependencies = [
    "chat-client-api",
    "chat-client-service-api-client",
    "httpx>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat_client_adapter"]
