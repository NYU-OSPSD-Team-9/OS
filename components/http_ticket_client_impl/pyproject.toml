[project]
name = "http-ticket-client-impl"
version = "0.1.0"
requires-python = ">=3.12"
description = "HTTP adapter that calls an issue tracker team's REST service"
dependencies = [
    "httpx>=0.27.0",
    "ticket-client-api",
    "tenacity>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/http_ticket_client_impl"]
