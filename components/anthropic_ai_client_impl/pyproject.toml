[project]
name = "anthropic-ai-client-impl"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ai-client-api",
    "anthropic>=0.25.0",
    "tenacity>=8.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anthropic_ai_client_impl"]
