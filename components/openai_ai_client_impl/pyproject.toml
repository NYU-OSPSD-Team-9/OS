[project]
name = "openai-ai-client-impl"
version = "0.1.0"
requires-python = ">=3.12"
description = "OpenAI implementation of ai-client-api"
dependencies = [
    "ai-client-api",
    "openai>=1.0.0",
    "tenacity>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openai_ai_client_impl"]
